<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기말 실기 060-1</title>
    <style>
        section.schedule {
            width:760px;
        }

        section article {
            float:left;
            width:140px;
            border:1px solid black;
            margin-right:10px;
            padding:10px;
            box-sizing:border-box;
        }

        #even {
            background-color:#eeeeee;
        }

        article:hover {
            background-color:lightyellow;
        }

        h3 {
            text-align:center;
        }

        ul {
            padding-left:20px;
        }

    </style>
</head>
<body>
    <section class="schedule">
        <article id="odd">
            <h3>월요일</h3>
            <p>HTML 복습</p>
            <ul>
                <li>시멘틱 태그</li>
                <li>목록 태그</li>
            </ul>
        </article>

        <article id="even">
            <h3>화요일</h3>
            <p>CSS 연습</p>
            <ul>
                <li>선택자</li>
                <li>박스 모델</li>
            </ul>
        </article>

        <article id="odd">
            <h3>수요일</h3>
            <p>JavaScript 기초</p>
            <ul>
                <li>변수</li>
                <li>함수</li>
            </ul>
        </article>

        <article id="even">
            <h3>목요일</h3>
            <p>DOM 실습</p>
            <ul>
                <li>요소 선택</li>
                <li>내용 변경</li>
            </ul>
        </article>

        <article id="odd">
            <h3>금요일</h3>
            <p>정리</p>
            <ul>
                <li>예제 풀이</li>
                <li>질문 정리</li>
            </ul>
        </article>
    </section>
</body>
</html>
