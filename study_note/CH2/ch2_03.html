<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction(){
            document
            .getElementByID("demo").
            innerHTML = "Hello javaScript@";
        }
    </script>
</head>
<body>
    <h1>my web page</h1>
    <p id="demo">a paragraph</p>
    <button type="button" onclick="myFunction()">Try it</button>
</body>
</html>
