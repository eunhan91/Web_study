<!DOCTYPE html>
<html lang="ko">
<head>

            border:1px solid black;
            margin-bottom:2px;
        }
    </style>

    <script>
        function addOrder(){
            let pname=document.getElementById("product").value;
            let num=parseInt(document.getElementById("quantity").value);
            let expen=0;
            const sum=0;
            const i=0;

            if(num<=1||document.getElementById("quantity").value==="")
                alert("적절한 값을 입력하세요");

            if (pname=="노트")
                expen=num*2000;
            else if(pname=="펜")
                expen=num*1000;
            else
                expen=num*1500;

            sum+=expen;

            document.getElementById("orderList").li[i].innerHTML=pname+" - "+num+" - "+expen;
            i+=1;
            document.getElementById("totalBox").innerHTML="총 금액:"+sum+"원";

        }

        function clearOrder(){
            document.getElementById("orderList").innerHTML="";
            document.getElementById("total").innerHTML="총 금액: 0원";
        }
    </script>
</head>

</html>
